<?xml version="1.0" encoding="utf-8"?>
<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" x="0px" y="0px"
	 viewBox="0 0 32 32" style="enable-background:new 0 0 32 32;" xml:space="preserve">
<defs>
  <linearGradient id="tsGrad" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#60a5fa"/>
    <stop offset="50%" stop-color="#a855f7"/>
    <stop offset="100%" stop-color="#7c3aed"/>
  </linearGradient>
  <style type="text/css">
    .ts-pulse {
      animation: ts-breathe 2.4s ease-in-out infinite;
      transform-origin: center;
    }
    @keyframes ts-breathe {
      0%, 100% { opacity: 0.85; }
      50% { opacity: 1; }
    }
  </style>
</defs>
<!-- Rounded background with gradient -->
<rect x="1" y="1" width="30" height="30" rx="7" fill="url(#tsGrad)"/>
<!-- Stethoscope: chest-piece (circle) + tubing + ear-tips -->
<g class="ts-pulse" fill="#ffffff">
  <!-- Chest piece (bottom circle) -->
  <circle cx="16" cy="22" r="3.2"/>
  <circle cx="16" cy="22" r="1.6" fill="url(#tsGrad)"/>
  <!-- Tubing: two curved lines forming a Y up to the ear tubes -->
  <path d="M16 19 Q 16 14, 11 11" stroke="#ffffff" stroke-width="1.6" fill="none" stroke-linecap="round"/>
  <path d="M16 19 Q 16 14, 21 11" stroke="#ffffff" stroke-width="1.6" fill="none" stroke-linecap="round"/>
  <!-- Ear tubes (top) -->
  <rect x="9.5" y="6.5" width="1.6" height="5" rx="0.8"/>
  <rect x="20.9" y="6.5" width="1.6" height="5" rx="0.8"/>
  <!-- Ear tips -->
  <circle cx="10.3" cy="6" r="1.3"/>
  <circle cx="21.7" cy="6" r="1.3"/>
</g>
<!-- Heartbeat pulse line across the middle -->
<g class="ts-pulse">
  <path d="M3 16 L9 16 L11 12 L13 20 L15 14 L17 18 L19 16 L29 16"
        stroke="#ffffff" stroke-width="1.2" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.7"/>
</g>
</svg>
